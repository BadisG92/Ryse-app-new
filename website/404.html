<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page non trouvée | Ryse</title>

  <!-- Google Fonts - Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary-dark), var(--primary-medium));
      text-align: center;
      padding: var(--spacing-lg);
    }

    .error-content {
      max-width: 600px;
      color: var(--white);
    }

    .error-code {
      font-size: clamp(6rem, 15vw, 12rem);
      font-weight: 900;
      line-height: 1;
      margin-bottom: var(--spacing-md);
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .error-title {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 700;
      margin-bottom: var(--spacing-md);
      color: var(--white);
    }

    .error-message {
      font-size: 1.125rem;
      margin-bottom: var(--spacing-xl);
      color: rgba(255, 255, 255, 0.9);
      line-height: 1.7;
    }

    .error-actions {
      display: flex;
      gap: var(--spacing-md);
      justify-content: center;
      flex-wrap: wrap;
    }

    .error-icon {
      font-size: 8rem;
      margin-bottom: var(--spacing-md);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    .search-box {
      margin-top: var(--spacing-xl);
    }

    .search-box input {
      width: 100%;
      max-width: 400px;
      padding: var(--spacing-md);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.1);
      color: var(--white);
      font-size: 1rem;
      font-family: var(--font-family);
      backdrop-filter: blur(10px);
    }

    .search-box input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--accent-blue);
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>

  <div class="error-page">
    <div class="error-content">
      <div class="error-icon">🤔</div>
      <div class="error-code">404</div>
      <h1 class="error-title">Oups ! Cette page n'existe pas</h1>
      <p class="error-message">
        Désolé, la page que vous recherchez est introuvable. Elle a peut-être été déplacée ou n'existe plus.
        Retournez à l'accueil ou contactez notre support si le problème persiste.
      </p>

      <div class="error-actions">
        <a href="/" class="btn btn-primary">
          <span>🏠</span>
          Retour à l'accueil
        </a>
        <a href="/support.html" class="btn btn-secondary">
          <span>💬</span>
          Contacter le support
        </a>
      </div>

      <div class="search-box">
        <input type="text" placeholder="Rechercher une page..." id="searchInput">
      </div>
    </div>
  </div>

  <script>
    // Redirect to search or home on enter
    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const query = e.target.value.toLowerCase();

        // Smart redirect based on keywords
        if (query.includes('support') || query.includes('aide') || query.includes('faq')) {
          window.location.href = '/support.html';
        } else if (query.includes('privacy') || query.includes('confidentialité') || query.includes('rgpd')) {
          window.location.href = '/privacy.html';
        } else if (query.includes('terms') || query.includes('conditions') || query.includes('cgu')) {
          window.location.href = '/terms.html';
        } else {
          window.location.href = '/';
        }
      }
    });

    // Log 404 for analytics (add your analytics here)
    console.log('404 Error - Page not found:', window.location.href);
  </script>

</body>
</html>
