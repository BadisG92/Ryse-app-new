<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RYZE — Choose Your Coach</title>
<style>
:root{
  --ink:#04060E; --stage:#0A1024; --steel:#141E38; --steel2:#1E2C4C; --edge:#39507E;
  --cyan:#37D2FF; --cyanD:#0E86D8; --mag:#FF2E77; --gold:#FFC24B; --rim:#EDF8FF; --dim:#8AA2CB;
  --disp:Impact,Haettenschweiler,"Franklin Gothic Bold","Arial Black",sans-serif;
  --cond:"Arial Narrow","Bahnschrift","Roboto Condensed",system-ui,sans-serif;
  --mono:"Consolas",ui-monospace,"Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
.wrap{min-height:100svh;display:grid;place-items:center;padding:2vh;font-family:var(--cond);
  background:radial-gradient(120% 90% at 50% -10%,#101a38 0%,#070b18 55%,#03050c 100%)}
.stage{position:relative;height:min(96svh,calc(96vw*16/9));aspect-ratio:9/16;container-type:size;overflow:hidden;
  border-radius:2.2cqw;display:flex;flex-direction:column;padding:3.4cqh 4cqw 2.6cqh;
  background:radial-gradient(80% 45% at 50% 34%,rgba(55,210,255,.16),transparent 60%),
    radial-gradient(70% 40% at 78% 20%,rgba(255,46,119,.14),transparent 62%),
    linear-gradient(180deg,#0c1430 0%,#0a1024 46%,#05080f 100%);
  box-shadow:0 3cqh 8cqh rgba(0,0,0,.7),inset 0 0 0 .22cqh #223257,inset 0 0 6cqh rgba(0,0,0,.9)}
.fx{position:absolute;inset:0;pointer-events:none}
.beams{background:repeating-linear-gradient(64deg,transparent 0 7cqw,rgba(120,190,255,.05) 7cqw 7.5cqw,transparent 7.5cqw 15cqw);
  mix-blend-mode:screen;opacity:.7;animation:drift 14s linear infinite}
.grid{background:linear-gradient(rgba(90,150,220,.05) .1cqh,transparent .1cqh),linear-gradient(90deg,rgba(90,150,220,.05) .1cqh,transparent .1cqh);
  background-size:6cqw 6cqw;mask:radial-gradient(70% 60% at 50% 80%,#000,transparent 76%);opacity:.6}
.vign{background:radial-gradient(120% 80% at 50% 42%,transparent 46%,rgba(2,4,10,.82) 100%)}
.brackets i{position:absolute;width:5cqw;height:5cqw;border:.34cqh solid var(--cyan);opacity:.75;filter:drop-shadow(0 0 .6cqh var(--cyan))}
.brackets i:nth-child(1){top:2cqh;left:2.4cqw;border-right:0;border-bottom:0}
.brackets i:nth-child(2){top:2cqh;right:2.4cqw;border-left:0;border-bottom:0}
.brackets i:nth-child(3){bottom:1.6cqh;left:2.4cqw;border-right:0;border-top:0}
.brackets i:nth-child(4){bottom:1.6cqh;right:2.4cqw;border-left:0;border-top:0}

.hud{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:3}
.hrow{display:flex;align-items:center;gap:1.6cqw}
.p1{font-family:var(--disp);font-style:italic;font-size:2.5cqh;color:var(--ink);background:var(--cyan);
  padding:.1cqh 1.4cqw;letter-spacing:.05em;clip-path:polygon(10% 0,100% 0,90% 100%,0 100%);box-shadow:0 0 1.6cqh rgba(55,210,255,.6)}
.kick{font-size:1.55cqh;letter-spacing:.34em;color:var(--dim);text-transform:uppercase}
.kick b{color:var(--mag);margin:0 .8cqw}
.ver{font-family:var(--mono);font-size:1.5cqh;letter-spacing:.18em;color:#6f86ac;text-transform:uppercase}
.bars{display:flex;gap:.5cqw;align-items:flex-end;height:2cqh}
.bars i{width:.7cqw;background:var(--cyan);box-shadow:0 0 .8cqh var(--cyan);animation:eq 1.1s ease-in-out infinite}
.bars i:nth-child(1){height:40%}.bars i:nth-child(2){height:78%;animation-delay:.2s}.bars i:nth-child(3){height:55%;animation-delay:.4s}

.prog{margin-top:2.2cqh;position:relative;z-index:3}
.ptop{display:flex;justify-content:space-between;align-items:baseline}
.plbl{font-size:1.6cqh;letter-spacing:.32em;color:var(--rim);text-transform:uppercase}
.pcnt{font-family:var(--disp);font-style:italic;font-size:2.8cqh;color:var(--gold);text-shadow:0 0 1.4cqh rgba(255,194,75,.5)}
.pcnt i{font-family:var(--cond);font-style:normal;font-size:1.5cqh;color:var(--dim);letter-spacing:.1em}
.segs{display:flex;gap:1.1cqw;margin:.9cqh 0 .7cqh}
.segs i{flex:1;height:1.3cqh;transform:skewX(-22deg);background:#101a30;box-shadow:inset 0 0 0 .12cqh #2c3f66}
.segs i.on{background:linear-gradient(90deg,var(--gold),#ffe3a0);box-shadow:0 0 1.4cqh rgba(255,194,75,.65),inset 0 0 0 .12cqh #ffe3a0}
.segs i.nx{background:#12203a;box-shadow:inset 0 0 0 .18cqh var(--cyan),0 0 1.4cqh rgba(55,210,255,.5);animation:pulse 1.6s ease-in-out infinite}
.phint{font-size:1.35cqh;letter-spacing:.16em;color:#7f97bf;text-transform:uppercase}
.phint b{color:var(--cyan);margin:0 .8cqw;font-weight:400}

.title{margin-top:2.4cqh;text-align:center;position:relative;z-index:3}
.kicker{font-size:1.7cqh;letter-spacing:.5em;color:var(--mag);text-shadow:0 0 1.4cqh rgba(255,46,119,.6)}
h1{line-height:.82;margin-top:.7cqh}
.t1{display:block;font-family:var(--disp);font-style:italic;font-size:4.4cqh;letter-spacing:.02em;color:#a9c2e6;
  transform:skewX(-8deg);text-shadow:0 .3cqh 0 #060b18}
.t2{display:inline-block;position:relative;font-family:var(--disp);font-style:italic;font-size:12.4cqh;letter-spacing:-.01em;
  transform:skewX(-8deg);color:transparent;-webkit-background-clip:text;background-clip:text;
  background:linear-gradient(180deg,#F4FBFF 0%,#C4E7FF 36%,#6FB1EC 49%,#2C6FB8 52%,#BFE3FF 72%,#EEF8FF 100%);
  filter:drop-shadow(0 .5cqh 0 #071022) drop-shadow(.5cqw .3cqh 0 rgba(255,46,119,.55)) drop-shadow(0 0 2.4cqh rgba(55,210,255,.55))}
.t2::after{content:attr(data-text);position:absolute;inset:0;color:transparent;-webkit-background-clip:text;background-clip:text;
  background:linear-gradient(100deg,transparent 42%,rgba(255,255,255,.92) 50%,transparent 58%);
  background-size:250% 100%;background-position:150% 0;animation:sweep 4.6s ease-in-out infinite}

.hero{position:relative;flex:1;min-height:0;z-index:2}
.spot{position:absolute;left:50%;top:-4%;width:78cqw;height:96%;transform:translateX(-50%);animation:glow 5.5s ease-in-out infinite;
  background:conic-gradient(from 200deg at 50% 6%,transparent 0,rgba(55,210,255,.24) 12%,transparent 27%,rgba(255,46,119,.16) 60%,transparent 73%,rgba(55,210,255,.2) 88%,transparent 100%);
  mask:radial-gradient(60% 82% at 50% 8%,#000 0,transparent 74%)}
.platform{position:absolute;left:50%;bottom:2%;width:60cqw;height:15cqw;transform:translateX(-50%)}
.disc{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(60% 130% at 50% 26%,#31486f 0%,#182642 48%,#0a1224 74%,#070d1a 100%);
  box-shadow:inset 0 .6cqh 1.4cqh rgba(120,180,255,.28),inset 0 -1cqh 2cqh rgba(0,0,0,.7)}
.ring{position:absolute;inset:-1.4cqw;border-radius:50%;opacity:.92;animation:breathe 3.4s ease-in-out infinite;
  background:conic-gradient(from 0deg,var(--cyan),#7ef0ff,var(--mag),var(--gold),var(--cyan));
  mask:radial-gradient(farthest-side,transparent calc(100% - 1.1cqw),#000 calc(100% - 1cqw));
  filter:drop-shadow(0 0 2cqh rgba(55,210,255,.55))}
.glow{position:absolute;left:50%;top:36%;width:80%;height:130%;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(50% 50% at 50% 50%,rgba(55,210,255,.4),transparent 70%);filter:blur(1.4cqh);animation:breathe 3.4s ease-in-out infinite}
.char{position:absolute;left:50%;bottom:6.5%;width:44cqw;height:64%;transform:translateX(-50%);z-index:2}
.body{position:absolute;left:50%;bottom:0;width:100%;height:66%;transform:translateX(-50%);
  border-radius:44% 44% 40% 40%/50% 50% 46% 46%;background:linear-gradient(115deg,#12203c 0%,#0b1428 42%,#070d1c 100%);
  box-shadow:inset -2.2cqw -1cqw 3cqw rgba(0,0,0,.6),inset 3.2cqw 2cqw 4cqw rgba(55,210,255,.34),
    inset -2.6cqw 1cqw 3cqw rgba(255,46,119,.28),0 1.4cqh 3cqh rgba(0,0,0,.5)}
.head{position:absolute;left:50%;bottom:52%;width:58%;height:44%;transform:translateX(-50%);border-radius:50%;
  background:linear-gradient(115deg,#12203c 0%,#0b1428 46%,#070d1c 100%);
  box-shadow:inset -1.8cqw -1cqw 2.6cqw rgba(0,0,0,.6),inset 2.4cqw 1.6cqw 3cqw rgba(55,210,255,.4),
    inset -2cqw 1cqw 2.6cqw rgba(255,46,119,.3),0 .8cqh 2cqh rgba(0,0,0,.5)}
.floortag{position:absolute;left:50%;bottom:1%;transform:translateX(-50%);z-index:3;animation:pulse 2.2s ease-in-out infinite;
  font-family:var(--disp);font-style:italic;font-size:1.9cqh;letter-spacing:.24em;color:var(--rim);text-shadow:0 0 1.6cqh var(--cyan)}

.card{position:relative;z-index:3;margin-top:1cqh;padding:1.6cqh 4cqw;border-radius:1.4cqw;
  background:linear-gradient(180deg,rgba(30,44,76,.9),rgba(12,20,40,.9));
  clip-path:polygon(0 0,100% 0,100% 82%,96% 100%,0 100%);
  box-shadow:inset 0 0 0 .18cqh #33507f,inset 0 .3cqh 1.4cqh rgba(90,160,255,.16)}
.card::before{content:"";position:absolute;left:0;top:0;width:1cqw;height:100%;background:var(--mag);box-shadow:0 0 1.6cqh var(--mag)}
.chd{display:flex;justify-content:space-between;align-items:center;padding-bottom:1cqh;border-bottom:.12cqh solid rgba(90,140,210,.3)}
.cname{font-family:var(--disp);font-style:italic;font-size:3.4cqh;letter-spacing:.02em;color:var(--rim);text-shadow:0 .2cqh 0 #060b18}
.ctier{font-size:1.5cqh;letter-spacing:.2em;color:var(--gold);border:.12cqh solid rgba(255,194,75,.5);padding:.4cqh 1.4cqw;border-radius:5cqw;text-transform:uppercase}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1cqh 4cqw;margin-top:1.3cqh}
.stat{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:1.4cqw}
.sl{font-size:1.4cqh;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;width:15cqw}
.bar{height:1.5cqh;border-radius:.3cqh;background:#0c1428;overflow:hidden;box-shadow:inset 0 0 0 .1cqh #2a3f66;
  -webkit-mask:repeating-linear-gradient(90deg,#000 0 8.5%,transparent 8.5% 11.5%);mask:repeating-linear-gradient(90deg,#000 0 8.5%,transparent 8.5% 11.5%)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyanD),var(--cyan) 70%,#bff2ff);box-shadow:0 0 1.2cqh rgba(55,210,255,.6)}
.stat b{font-family:var(--mono);font-size:1.6cqh;color:var(--rim)}

.roster{display:grid;grid-template-columns:repeat(6,1fr);gap:2cqw;margin-top:1.8cqh;position:relative;z-index:3}
.tile{position:relative;aspect-ratio:1;transform:skewX(-8deg);border:0;cursor:pointer;background:transparent;padding:0}
.slot{position:absolute;inset:0;display:grid;place-items:center;border-radius:1.4cqw;
  background:linear-gradient(160deg,#16233f,#0a1224);box-shadow:inset 0 0 0 .18cqh #2c4066,inset 0 -1cqh 2cqh rgba(0,0,0,.5)}
.no{position:absolute;top:.6cqh;left:1cqw;z-index:2;transform:skewX(8deg);font-family:var(--mono);font-size:1.3cqh;color:#5f78a0}
.mini{width:56%;height:56%;border-radius:40% 40% 38% 38%/48% 48% 42% 42%;transform:skewX(8deg);
  background:linear-gradient(120deg,#2a67c4,#173a86);box-shadow:inset 1.4cqw 1cqw 2cqw rgba(140,200,255,.5),inset -1cqw -.6cqw 1.6cqw rgba(0,0,0,.5)}
.mini.alt{background:linear-gradient(120deg,#c43a72,#7d1f4a);box-shadow:inset 1.4cqw 1cqw 2cqw rgba(255,170,205,.5),inset -1cqw -.6cqw 1.6cqw rgba(0,0,0,.5)}
.lk .slot{background:linear-gradient(160deg,#0c1428,#070d1a);box-shadow:inset 0 0 0 .18cqh #1c2c4a}
.lock{transform:skewX(8deg);width:3cqw;height:2.6cqw;border-radius:.5cqw;background:#41598a;position:relative;box-shadow:0 0 1cqh rgba(0,0,0,.4)}
.lock::before{content:"";position:absolute;left:50%;top:-2cqw;width:2cqw;height:2cqw;transform:translateX(-50%);
  border:.5cqw solid #41598a;border-bottom:0;border-radius:1.4cqw 1.4cqw 0 0}
.sel .slot{box-shadow:inset 0 0 0 .3cqh var(--cyan),0 0 2.4cqh rgba(55,210,255,.6);transform:translateY(-1.2cqh)}
.sel .no{color:var(--cyan)}
.tgt{position:absolute;inset:-1.2cqw;z-index:3;pointer-events:none}
.tgt::before,.tgt::after{content:"";position:absolute;width:2.4cqw;height:2.4cqw;border:.3cqh solid var(--gold);filter:drop-shadow(0 0 .8cqh var(--gold));animation:pulse 1.4s ease-in-out infinite}
.tgt::before{top:0;left:0;border-right:0;border-bottom:0}
.tgt::after{bottom:0;right:0;border-left:0;border-top:0}

@keyframes drift{to{background-position:15cqw 0}}
@keyframes breathe{0%,100%{opacity:.72;transform:scale(1)}50%{opacity:1;transform:scale(1.035)}}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:.95}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes sweep{0%,55%{background-position:150% 0}100%{background-position:-50% 0}}
@keyframes eq{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <div class="fx beams"></div>
    <div class="fx grid"></div>
    <div class="fx vign"></div>
    <div class="brackets"><i></i><i></i><i></i><i></i></div>

    <header class="hud">
      <div class="hrow"><span class="p1">P1</span><span class="kick">RYZE ARENA<b>·</b>SEASON 01</span></div>
      <div class="hrow"><span class="bars"><i></i><i></i><i></i></span><span class="ver">SELECT.EXE</span></div>
    </header>

    <section class="prog">
      <div class="ptop"><span class="plbl">ROSTER&nbsp;UNLOCK</span><span class="pcnt">02<i>&nbsp;/&nbsp;06</i></span></div>
      <div class="segs"><i class="on"></i><i class="on"></i><i class="nx"></i><i></i><i></i><i></i></div>
      <div class="phint">NEXT UNLOCK<b>—</b>CLEAR 3 WORKOUTS TO OPEN SLOT 03</div>
    </section>

    <section class="title">
      <span class="kicker">◆&nbsp;&nbsp;CHARACTER&nbsp;SELECT&nbsp;&nbsp;◆</span>
      <h1><span class="t1">CHOOSE YOUR</span><span class="t2" data-text="COACH">COACH</span></h1>
    </section>

    <section class="hero">
      <div class="spot"></div>
      <div class="char"><span class="body"></span><span class="head"></span></div>
      <div class="platform"><span class="glow"></span><span class="ring"></span><span class="disc"></span></div>
      <div class="floortag">◤&nbsp;READY&nbsp;◥</div>
    </section>

    <section class="card">
      <div class="chd"><span class="cname">CHARACTER NAME</span><span class="ctier">TIER&nbsp;S · COACH</span></div>
      <div class="stats">
        <div class="stat"><span class="sl">STRENGTH</span><span class="bar"><i style="width:86%"></i></span><b>86</b></div>
        <div class="stat"><span class="sl">STAMINA</span><span class="bar"><i style="width:72%"></i></span><b>72</b></div>
        <div class="stat"><span class="sl">SPEED</span><span class="bar"><i style="width:64%"></i></span><b>64</b></div>
        <div class="stat"><span class="sl">FOCUS</span><span class="bar"><i style="width:91%"></i></span><b>91</b></div>
      </div>
    </section>

    <nav class="roster">
      <button class="tile sel"><b class="no">01</b><span class="slot"><span class="mini"></span></span><span class="tgt"></span></button>
      <button class="tile"><b class="no">02</b><span class="slot"><span class="mini alt"></span></span></button>
      <button class="tile lk"><b class="no">03</b><span class="slot"><i class="lock"></i></span></button>
      <button class="tile lk"><b class="no">04</b><span class="slot"><i class="lock"></i></span></button>
      <button class="tile lk"><b class="no">05</b><span class="slot"><i class="lock"></i></span></button>
      <button class="tile lk"><b class="no">06</b><span class="slot"><i class="lock"></i></span></button>
    </nav>
  </div>
</div>
</body>
</html>
