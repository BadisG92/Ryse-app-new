<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ryze - Screenshot 2 - Tracking Rapide</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* DA Ryze */
            --bg-primary: #F8FAFC;
            --bg-secondary: #F1F5F9;
            --navy-dark: #0B132B;
            --navy-medium: #1C2951;
            --text-primary: #0B132B;
            --text-secondary: #64748B;
            --text-muted: #94A3B8;
            --border-light: #E2E8F0;
            --white: #FFFFFF;
            --green-accent: #22C55E;
            --blue-accent: #3B82F6;
            --orange-accent: #F97316;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .screenshot-container {
            width: 1284px;
            height: 2778px;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
            border-radius: 60px;
        }

        /* Header */
        .header {
            padding: 100px 80px 60px;
            text-align: center;
        }

        .main-title {
            font-size: 92px;
            font-weight: 900;
            color: var(--text-primary);
            line-height: 1.05;
            letter-spacing: -4px;
            margin-bottom: 30px;
        }

        .subtitle {
            font-size: 40px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* 3 Input methods icons */
        .methods-section {
            padding: 50px 80px;
        }

        .methods-grid {
            display: flex;
            justify-content: center;
            gap: 60px;
        }

        .method-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .method-icon {
            width: 140px;
            height: 140px;
            border-radius: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .method-icon.photo {
            background: linear-gradient(145deg, var(--green-accent), #16a34a);
        }

        .method-icon.voice {
            background: linear-gradient(145deg, var(--orange-accent), #ea580c);
        }

        .method-icon.text {
            background: linear-gradient(145deg, var(--blue-accent), #2563eb);
        }

        .method-icon svg {
            width: 65px;
            height: 65px;
            stroke: white;
            stroke-width: 2;
            fill: none;
        }

        .method-label {
            font-size: 36px;
            font-weight: 800;
            color: var(--text-primary);
        }

        /* Phone mockup section */
        .phone-section {
            display: flex;
            justify-content: center;
            padding: 40px 80px;
        }

        .phone-frame {
            width: 580px;
            height: 1180px;
            background: var(--navy-dark);
            border-radius: 55px;
            padding: 12px;
            box-shadow: 0 50px 100px rgba(11, 19, 43, 0.3);
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            border-radius: 45px;
            overflow: hidden;
            position: relative;
        }

        .dynamic-island {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 130px;
            height: 38px;
            background: #000;
            border-radius: 22px;
            z-index: 100;
        }

        /* Scanner UI inside phone */
        .scanner-header {
            padding: 75px 30px 25px;
            text-align: center;
        }

        .scanner-title {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-primary);
        }

        /* Camera view */
        .camera-container {
            margin: 20px;
            height: 480px;
            background: linear-gradient(145deg, #1a2a1a 0%, #0d1a0d 100%);
            border-radius: 25px;
            position: relative;
            overflow: hidden;
        }

        /* Food - Poulet riz brocolis */
        .food-plate {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            height: 75%;
        }

        .plate-bg {
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse 100% 90% at 50% 50%, #f5f5f5 0%, #e0e0e0 100%);
            border-radius: 50%;
            position: absolute;
            box-shadow:
                inset 0 -15px 30px rgba(0,0,0,0.1),
                0 10px 30px rgba(0,0,0,0.3);
        }

        .food-item {
            position: absolute;
        }

        /* Poulet grillé */
        .chicken {
            width: 45%;
            height: 35%;
            top: 15%;
            left: 10%;
            background: linear-gradient(145deg, #D4A574 0%, #B8956A 50%, #A67C52 100%);
            border-radius: 40% 60% 50% 40%;
            transform: rotate(-10deg);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .chicken::before {
            content: '';
            position: absolute;
            top: 20%;
            left: 15%;
            width: 70%;
            height: 60%;
            background: linear-gradient(145deg, #C49464 0%, #A67C52 100%);
            border-radius: 50%;
            opacity: 0.5;
        }

        /* Riz */
        .rice {
            width: 35%;
            height: 40%;
            bottom: 15%;
            right: 12%;
            background: radial-gradient(ellipse at center, #FFFEF5 0%, #F5F0DC 100%);
            border-radius: 50% 50% 45% 45%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .rice::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 10%;
            width: 80%;
            height: 60%;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 3px,
                rgba(230, 225, 200, 0.5) 3px,
                rgba(230, 225, 200, 0.5) 6px
            );
            border-radius: 50%;
        }

        /* Brocolis */
        .broccoli-1 {
            width: 22%;
            height: 25%;
            top: 50%;
            left: 30%;
            background: radial-gradient(circle at 30% 30%, #4CAF50, #2E7D32);
            border-radius: 50% 50% 30% 30%;
            transform: rotate(-15deg);
        }

        .broccoli-1::before {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 40%;
            width: 20%;
            height: 30%;
            background: #6B8E23;
            border-radius: 0 0 50% 50%;
        }

        .broccoli-2 {
            width: 18%;
            height: 20%;
            top: 25%;
            right: 20%;
            background: radial-gradient(circle at 40% 40%, #66BB6A, #388E3C);
            border-radius: 50% 50% 30% 30%;
            transform: rotate(20deg);
        }

        .broccoli-3 {
            width: 15%;
            height: 18%;
            bottom: 30%;
            left: 15%;
            background: radial-gradient(circle at 35% 35%, #81C784, #43A047);
            border-radius: 50% 50% 30% 30%;
        }

        /* Scan overlay */
        .scan-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }

        .scan-line {
            position: absolute;
            left: 15px;
            right: 15px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--green-accent), transparent);
            box-shadow: 0 0 15px var(--green-accent), 0 0 30px var(--green-accent);
            animation: scan 2.5s ease-in-out infinite;
        }

        @keyframes scan {
            0%, 100% { top: 30px; }
            50% { top: calc(100% - 30px); }
        }

        .scan-corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 3px solid var(--green-accent);
        }

        .corner-tl { top: 12px; left: 12px; border-right: none; border-bottom: none; border-radius: 10px 0 0 0; }
        .corner-tr { top: 12px; right: 12px; border-left: none; border-bottom: none; border-radius: 0 10px 0 0; }
        .corner-bl { bottom: 12px; left: 12px; border-right: none; border-top: none; border-radius: 0 0 0 10px; }
        .corner-br { bottom: 12px; right: 12px; border-left: none; border-top: none; border-radius: 0 0 10px 0; }

        /* Result card */
        .result-card {
            margin: 20px;
            background: white;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(11, 19, 43, 0.1);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .result-title {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-primary);
        }

        .result-badge {
            background: var(--green-accent);
            color: white;
            font-size: 16px;
            font-weight: 700;
            padding: 8px 18px;
            border-radius: 50px;
        }

        .result-calories {
            text-align: center;
            margin-bottom: 20px;
        }

        .calories-number {
            font-size: 56px;
            font-weight: 900;
            color: var(--text-primary);
            line-height: 1;
        }

        .calories-label {
            font-size: 20px;
            color: var(--text-secondary);
        }

        .macros-row {
            display: flex;
            gap: 12px;
        }

        .macro-item {
            flex: 1;
            text-align: center;
            padding: 15px 8px;
            background: var(--bg-secondary);
            border-radius: 14px;
        }

        .macro-value {
            font-size: 26px;
            font-weight: 800;
        }

        .macro-label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .protein .macro-value { color: var(--blue-accent); }
        .carbs .macro-value { color: var(--orange-accent); }
        .fat .macro-value { color: #EC4899; }

        /* Bottom features */
        .features-section {
            padding: 50px 60px;
        }

        .features-grid {
            display: flex;
            gap: 24px;
        }

        .feature-card {
            flex: 1;
            background: var(--white);
            border: 1.5px solid var(--border-light);
            border-radius: 28px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(11, 19, 43, 0.05);
        }

        .feature-value {
            font-size: 52px;
            font-weight: 900;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .feature-value.green {
            color: var(--green-accent);
        }

        .feature-label {
            font-size: 26px;
            color: var(--text-secondary);
            line-height: 1.3;
        }

        /* Bottom app indicator */
        .bottom-section {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 60px 80px;
            background: linear-gradient(to top, var(--bg-primary) 70%, transparent);
        }

        .app-indicator {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
        }

        .app-logo {
            width: 65px;
            height: 65px;
            background: linear-gradient(145deg, var(--navy-dark), var(--navy-medium));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 900;
            color: white;
        }

        .app-name {
            font-size: 44px;
            font-weight: 900;
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="screenshot-container">
        <!-- Header -->
        <div class="header">
            <h1 class="main-title">SCANNEZ.<br>PARLEZ. ÉCRIVEZ.</h1>
            <p class="subtitle">C'est tracké en 5 secondes.</p>
        </div>

        <!-- 3 Input methods -->
        <div class="methods-section">
            <div class="methods-grid">
                <div class="method-card">
                    <div class="method-icon photo">
                        <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                    </div>
                    <span class="method-label">Photo</span>
                </div>
                <div class="method-card">
                    <div class="method-icon voice">
                        <svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
                    </div>
                    <span class="method-label">Voix</span>
                </div>
                <div class="method-card">
                    <div class="method-icon text">
                        <svg viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2" ry="2"/><path d="M6 8h.001M10 8h.001M14 8h.001M18 8h.001M8 12h.001M12 12h.001M16 12h.001M7 16h10"/></svg>
                    </div>
                    <span class="method-label">Texte</span>
                </div>
            </div>
        </div>

        <!-- Phone mockup -->
        <div class="phone-section">
            <div class="phone-frame">
                <div class="phone-screen">
                    <div class="dynamic-island"></div>

                    <div class="scanner-header">
                        <div class="scanner-title">Scanner votre repas</div>
                    </div>

                    <!-- Camera view -->
                    <div class="camera-container">
                        <div class="food-plate">
                            <div class="plate-bg"></div>
                            <div class="food-item chicken"></div>
                            <div class="food-item rice"></div>
                            <div class="food-item broccoli-1"></div>
                            <div class="food-item broccoli-2"></div>
                            <div class="food-item broccoli-3"></div>
                        </div>
                        <div class="scan-overlay">
                            <div class="scan-line"></div>
                            <div class="scan-corner corner-tl"></div>
                            <div class="scan-corner corner-tr"></div>
                            <div class="scan-corner corner-bl"></div>
                            <div class="scan-corner corner-br"></div>
                        </div>
                    </div>

                    <!-- Result -->
                    <div class="result-card">
                        <div class="result-header">
                            <span class="result-title">Poulet Riz Brocolis</span>
                            <span class="result-badge">Identifié</span>
                        </div>
                        <div class="result-calories">
                            <div class="calories-number">520</div>
                            <div class="calories-label">calories</div>
                        </div>
                        <div class="macros-row">
                            <div class="macro-item protein">
                                <div class="macro-value">42g</div>
                                <div class="macro-label">Protéines</div>
                            </div>
                            <div class="macro-item carbs">
                                <div class="macro-value">48g</div>
                                <div class="macro-label">Glucides</div>
                            </div>
                            <div class="macro-item fat">
                                <div class="macro-value">12g</div>
                                <div class="macro-label">Lipides</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Features -->
        <div class="features-section">
            <div class="features-grid">
                <div class="feature-card">
                    <div class="feature-value green">5s</div>
                    <div class="feature-label">Pour tracker</div>
                </div>
                <div class="feature-card">
                    <div class="feature-value">1M+</div>
                    <div class="feature-label">Aliments</div>
                </div>
                <div class="feature-card">
                    <div class="feature-value">IA</div>
                    <div class="feature-label">Gemini 2.0</div>
                </div>
            </div>
        </div>

        <!-- Bottom -->
        <div class="bottom-section">
            <div class="app-indicator">
                <div class="app-logo">R</div>
                <span class="app-name">Ryze</span>
            </div>
        </div>
    </div>
</body>
</html>
